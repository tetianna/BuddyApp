name: Playwright

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: regression
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 60 || 30 }}
    env:
      APP_URL: ${{ secrets.APP_URL }}
      APP_USER_EMAIL: ${{ secrets.APP_USER_EMAIL }}
      APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD }}
      APP_ALT_USER_EMAIL: ${{ secrets.APP_ALT_USER_EMAIL }}
      APP_ALT_USER_PASSWORD: ${{ secrets.APP_ALT_USER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-regression
          path: playwright-report/
          retention-days: 30
